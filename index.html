      body {

      ::selection {
        background-color: rgba(255, 255, 255, 0.9);
        color: #000000;

      /* Heavy Film Grain for Lusion look */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9990;
        opacity: 0.07; 
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        animation: noise 0.2s steps(4) infinite;
      }

      @keyframes noise {
        0% { transform: translate(0,0); }
        10% { transform: translate(-5px,-5px); }
        20% { transform: translate(-10px,5px); }
        30% { transform: translate(5px,-10px); }
        40% { transform: translate(-5px,15px); }
        50% { transform: translate(-10px,5px); }
        60% { transform: translate(15px,0); }
        70% { transform: translate(0,10px); }
        80% { transform: translate(-15px,0); }
        90% { transform: translate(10px,5px); }
        100% { transform: translate(5px,0); }
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {

      ::-webkit-scrollbar-track {

      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }

      .stroke-text {
        -webkit-text-stroke: 1px black;
        color: transparent;
      }
      
      /* Lusion-style Chromatic Text Split */
      .chromatic-text {
        text-shadow: 2px 0 rgba(255,0,0,0.5), -2px 0 rgba(0,255,255,0.5);
      }
      
      .origin-top { transform-origin: top; }
      .origin-left { transform-origin: left; }
      
      h1, h2, h3, a, p {
        text-rendering: optimizeLegibility;
      }

      /* Liquid Filter for distortions */
      .liquid-transition {
