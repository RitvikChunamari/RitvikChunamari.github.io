<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="emerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="whiteGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#10B981" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Transparent Background (No rect) -->

  <!-- Logo Group -->
  <g transform="translate(800, 380)" filter="url(#shadow)">
    <!-- Scale up and center the 120x120 viewBox logic -->
    <g transform="translate(-195, -150) scale(3)">
      <!-- Vertical backbone (Candlestick) -->
      <rect x="25" y="15" width="16" height="70" rx="8" fill="url(#whiteGlow)" />
      
      <!-- Top diagonal (Upward momentum / Neural branch) -->
      <path d="M 41 50 L 80 15" stroke="url(#emerald)" stroke-width="16" stroke-linecap="round" />
      <!-- Top horizontal extension (Data pipeline) -->
      <path d="M 80 15 L 105 15" stroke="url(#emerald)" stroke-width="16" stroke-linecap="round" opacity="0.4" />
      
      <!-- Bottom diagonal -->
      <path d="M 41 50 L 80 85" stroke="url(#whiteGlow)" stroke-width="16" stroke-linecap="round" />
      <!-- Bottom horizontal extension -->
      <path d="M 80 85 L 105 85" stroke="url(#whiteGlow)" stroke-width="16" stroke-linecap="round" opacity="0.4" />
      
      <!-- Center joint (Neural Node) -->
      <circle cx="41" cy="50" r="8" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography -->
  <text x="800" y="700" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="16">KINETIX</text>
  <text x="800" y="770" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="500" fill="#9CA3AF" text-anchor="middle" letter-spacing="32">QUANT</text>
</svg>
