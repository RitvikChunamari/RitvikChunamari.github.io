<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141419" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="1"/>
    </radialGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#050507"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <!-- Architectural Frame -->
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Swiss Corner Registration Brackets -->
  <path d="M 48 80 L 48 48 L 80 48" stroke="#FF3B30" stroke-width="3" fill="none"/>
  <path d="M 1152 80 L 1152 48 L 1120 48" stroke="#FF3B30" stroke-width="3" fill="none"/>
  <path d="M 48 550 L 48 582 L 80 582" stroke="#FF3B30" stroke-width="3" fill="none"/>
  <path d="M 1152 550 L 1152 582 L 1120 582" stroke="#FF3B30" stroke-width="3" fill="none"/>

  <!-- Top Telemetry -->
  <text x="80" y="88" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="0.25em" fill="rgba(255,255,255,0.6)" font-weight="600">FOLIO // RITVIK CHUNAMARI</text>
  <text x="1120" y="88" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="0.25em" fill="rgba(255,255,255,0.6)" font-weight="600" text-anchor="end">BOULDER &amp; ARVADA, CO // 2026</text>

  <!-- Signature Monogram Emblem -->
  <g transform="translate(600, 220)">
    <rect x="-70" y="-70" width="140" height="140" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="80" font-weight="900" letter-spacing="-0.06em" fill="#EDEDED" text-anchor="middle">RC</text>
    <circle cx="56" cy="-56" r="4.5" fill="#FF3B30"/>
  </g>

  <!-- Monumental Name -->
  <text x="600" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em" fill="#EDEDED" text-anchor="middle">RITVIK CHUNAMARI</text>

  <!-- Accent Line -->
  <line x1="560" y1="388" x2="640" y2="388" stroke="#FF3B30" stroke-width="2.5"/>

  <!-- Role Title -->
  <text x="600" y="428" font-family="'IBM Plex Mono', monospace" font-size="16" letter-spacing="0.28em" fill="#EDEDED" text-anchor="middle" font-weight="600">PRODUCT DESIGNER &amp; CREATIVE TECHNOLOGIST</text>

  <!-- Brand Manifesto -->
  <text x="600" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="300" letter-spacing="0.04em" fill="rgba(255,255,255,0.7)" text-anchor="middle">Design for humans. Build for wonder.</text>

  <!-- Bottom Badges / Disciplines -->
  <text x="600" y="540" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.22em" fill="rgba(255,255,255,0.4)" text-anchor="middle">PRODUCT DESIGN // HCI // CREATIVE COMPUTING // RADICAL ACCESSIBILITY</text>
</svg>
